# Patina: window chrome that rides along with any Omarchy theme.
# Super+Space → Style → Patina toggles it. `omarchy-patina on|off|toggle`.
#
# Install never replaces looknfeel.lua. If you already set rounding, gaps,
# borders, or glow there, apply writes manage_* = false so those stay yours.

applied = true

# Corner preset: sharp (0px, Omarchy) | soft (6px) | round (12px)
corners = "soft"
rounding = 6
border_size = 2
# Gap preset: tight | default | loose
# tight   = 2px tiles and edges
# default = Omarchy stock (5px tiles, 10px edges) — first install
# loose   = 10px tiles, 20px edges
gaps = "default"

gaps_out_top = 10
gaps_out_right = 10
gaps_out_bottom = 10
gaps_out_left = 10

gaps_in_top = 5
gaps_in_right = 5
gaps_in_bottom = 5
gaps_in_left = 5

# Unfocused border: mix this much of the theme foreground into the background.
inactive_mix = 0.15

# Push the theme accent to full saturation at the same lightness.
saturate_accent = true

glow = false
glow_range = 10
glow_power = 4
# Alphas are 60% of the original Smart Tweaks recipe (0.30 / 0.20).
glow_alpha = 0.18
inner_glow_range = 5
inner_glow_alpha = 0.12
